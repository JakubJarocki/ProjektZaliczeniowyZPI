<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logowanie — MeetFit</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg" id="app-navbar"></nav>

  <div class="container" style="min-height:85vh;display:flex;align-items:center;justify-content:center;padding:2rem 1rem;">
    <div style="width:100%;max-width:420px;">
      <div style="text-align:center;margin-bottom:2rem;">
        <a href="/" style="font-family:'Syne',sans-serif;font-weight:800;font-size:2rem;color:var(--white);text-decoration:none;">Meet<span style="color:var(--primary);">Fit</span></a>
        <p style="color:var(--text-muted);margin-top:0.5rem;">Zaloguj się, żeby znaleźć trening</p>
      </div>
      <div class="card">
        <div class="card-body" style="padding:2rem;">
          <div id="error-msg"></div>
          <div class="mb-3">
            <label class="form-label">Login lub email</label>
            <input type="text" class="form-control" id="username" placeholder="twoj_login" autocomplete="username">
          </div>
          <div class="mb-4">
            <label class="form-label">Hasło</label>
            <input type="password" class="form-control" id="password" placeholder="••••••••" autocomplete="current-password">
          </div>
          <button class="btn btn-primary w-100" id="login-btn" onclick="doLogin()">Zaloguj się</button>
          <hr style="border-color:var(--border);margin:1.5rem 0;">
          <p style="text-align:center;color:var(--text-muted);font-size:0.9rem;margin:0;">
            Nie masz konta? <a href="/register" style="color:var(--primary);font-weight:600;">Zarejestruj się</a>
          </p>
          <p style="text-align:center;color:var(--text-muted);font-size:0.8rem;margin-top:1rem;">
            Demo: <code style="color:var(--primary);">jakub / test123</code> · admin: <code style="color:var(--primary);">admin / admin123</code>
          </p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/app.js"></script>
  <script>
  document.getElementById('password').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
  document.getElementById('username').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

  async function doLogin(){
    const btn = document.getElementById('login-btn');
    const errEl = document.getElementById('error-msg');
    errEl.innerHTML = '';
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    if(!username || !password){
      errEl.innerHTML = '<div class="alert alert-danger">Uzupełnij wszystkie pola</div>';
      return;
    }
    btn.disabled = true; btn.textContent = 'Logowanie...';
    try {
      await api('/api/login', {method:'POST', body:JSON.stringify({username, password})});
      const redir = new URLSearchParams(location.search).get('next') || '/';
      window.location.href = redir;
    } catch(e) {
      errEl.innerHTML = `<div class="alert alert-danger">${escHtml(e.message)}</div>`;
      btn.disabled = false; btn.textContent = 'Zaloguj się';
    }
  }

  // Jeśli już zalogowany, przekieruj
  api('/api/me').then(d => { if(d.logged_in) window.location.href='/'; });
  </script>
</body>
</html>
